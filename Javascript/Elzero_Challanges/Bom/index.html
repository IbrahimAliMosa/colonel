<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .tasks {
            background-color: rgb(226, 226, 226);
            height: fit-content;
            width: 700px;
            border: none;
            border-radius: 10px;
            margin: auto;
            text-align: center;
            /* display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly; */
        }

        .container {
            background-color: rgb(226, 226, 226);
            height: 100px;
            width: 700px;
            border: none;
            border-radius: 10px;
            margin: auto;
        }

        .input,
        .add {
            border: none;
            border-radius: 10px;
            margin: auto;
            margin-top: 10px;
        }

        .add {
            background-color: rgb(250, 125, 0);
            padding: 25px;
            font-size: 18px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .input {
            width: 500px;
            height: 50px;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <br>
    <div class="container">
        <input type="text" name="task" id="task" class="input">
        <input type="submit" id="btn" value="Add Task" class="add" onclick="addTask()">
    </div><br>
    <div class="tasks" id="tasks">
    </div>
    <script src="gem.js"></script>
    <!-- <script src="index.js"></script> -->
</body>

</html>
